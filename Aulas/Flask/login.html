{% extends "base.html" %}

{% block titulo %}Entrar{% endblock %}

{% block conteudo %}
  <h1>Entrar</h1>
  <p>É preciso entrar para cadastrar, editar ou apagar computadores.</p>

  <form method="post">
    <label>Usuário
      <input type="text" name="usuario" required>
    </label>
    <label>Senha
      <input type="password" name="senha" required>
    </label>
    <button type="submit">Entrar</button>
  </form>
{% endblock %}
